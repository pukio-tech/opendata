<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Data Perú - Mapa e Imágenes por Distrito</title>

    <!-- CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Panel izquierdo: Mapa */
        #mapa {
            flex: 2;
            height: 100%;
        }

        /* Panel derecho: Galería */
        #panel-galeria {
            flex: 1;
            height: 100%;
            padding: 20px;
            background-color: #f8f9fa;
            border-left: 1px solid #ccc;
            overflow-y: auto;
        }

        h2 {
            margin-bottom: 10px;
            color: #333;
        }

        p.subtitulo {
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
        }

        /* Grid de imágenes */
        .grid-fotos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .tarjeta-foto {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .tarjeta-foto img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            display: block;
        }

        .tarjeta-foto p {
            padding: 8px;
            font-size: 12px;
            color: #444;
        }

        .sin-resultados {
            color: #888;
            font-style: italic;
        }
    </style>
</head>

<body>

    <!-- Contenedor del Mapa -->
    <div id="mapa"></div>

    <!-- Contenedor de la Galería Lateral -->
    <div id="panel-galeria">
        <h2 id="titulo-distrito">Selecciona un distrito</h2>
        <p class="subtitulo" id="subtitulo">Haz clic sobre un distrito en el mapa para ver sus imágenes en datos
            abiertos.</p>

        <div id="grid-fotos" class="grid-fotos">
            <!-- Aquí se renderizarán las fotos dinámicamente -->
        </div>
    </div>

    <!-- JavaScript de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Dataset de prueba (Simulación de tu catálogo de imágenes con datos abiertos)
        const catalogoImagenes = [
            {
                distrito: "BREÑA",
                titulo: "Plaza Bolognesi",
                url: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=400&q=80"
            },
            {
                distrito: "LIMA",
                titulo: "Plaza Mayor de Lima",
                url: "https://images.unsplash.com/photo-1526392060635-9d6019884377?w=400&q=80"
            },
            {
                distrito: "LIMA",
                titulo: "Catedral de Lima",
                url: "https://images.unsplash.com/photo-1589308078059-be1415eab4c3?w=400&q=80"
            },
            {
                distrito: "MIRAFLORES",
                titulo: "Parque del Amor",
                url: "https://images.unsplash.com/photo-1531968455001-5c5272a41129?w=400&q=80"
            },
            {
                distrito: "CALLAO",
                titulo: "Puerto del Callao",
                url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400&q=80"
            }
        ];

        // 2. Inicializar el mapa centrado en Lima
        const map = L.map('mapa').setView([-12.04637, -77.04279], 11);

        // Agregar mapa base de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Estilos para los polígonos del mapa
        const estiloNormal = {
            color: "#2b8a3e",
            weight: 1.5,
            opacity: 0.8,
            fillColor: "#51cf66",
            fillOpacity: 0.3
        };

        const estiloSeleccionado = {
            color: "#d9480f",
            weight: 3,
            opacity: 1,
            fillColor: "#ffec99",
            fillOpacity: 0.6
        };

        let capaSeleccionada = null;

        // 3. Cargar el GeoJSON de distritos de peru-geojson-datasets

        // En lugar de la URL directa a GitHub, usa esta:
        const geojsonUrl = './lima_callao_distritos_simple.geojson';

        fetch(geojsonUrl)
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    style: estiloNormal,
                    onEachFeature: function (feature, layer) {
                        // Nombre del distrito dentro de las propiedades del GeoJSON
                        const nombreDistrito = feature.properties.distrito;

                        // Popup básico al pasar el mouse o hacer clic
                        layer.bindTooltip(nombreDistrito, { sticky: true });

                        // Evento de clic sobre el distrito
                        layer.on('click', function () {
                            // Restaurar el estilo del distrito seleccionado anteriormente
                            if (capaSeleccionada) {
                                capaSeleccionada.setStyle(estiloNormal);
                            }

                            // Resaltar el nuevo distrito seleccionado
                            layer.setStyle(estiloSeleccionado);
                            capaSeleccionada = layer;

                            // Filtrar y mostrar las imágenes asociadas
                            mostrarFotosDistrito(nombreDistrito);
                        });
                    }
                }).addTo(map);
            })
            .catch(error => console.error("Error al cargar el GeoJSON:", error));

        // 4. Función para filtrar la galería de imágenes
        function mostrarFotosDistrito(distrito) {
            const titulo = document.getElementById('titulo-distrito');
            const subtitulo = document.getElementById('subtitulo');
            const grid = document.getElementById('grid-fotos');

            titulo.textContent = distrito;
            grid.innerHTML = ''; // Limpiar galería previa

            // Filtrar imágenes que correspondan al distrito (coincidencia de texto)
            const fotosFiltradas = catalogoImagenes.filter(
                item => item.distrito.toUpperCase() === distrito.toUpperCase()
            );

            if (fotosFiltradas.length > 0) {
                subtitulo.textContent = `Se encontraron ${fotosFiltradas.length} recurso(s) multimedia:`;

                fotosFiltradas.forEach(foto => {
                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'tarjeta-foto';
                    tarjeta.innerHTML = `
            <img src="${foto.url}" alt="${foto.titulo}">
            <p><b>${foto.titulo}</b></p>
          `;
                    grid.appendChild(tarjeta);
                });
            } else {
                subtitulo.textContent = 'No hay imágenes disponibles para este distrito en el catálogo.';
                grid.innerHTML = '<p class="sin-resultados">Sin datos multimedia registrados.</p>';
            }
        }
    </script>
</body>

</html>
